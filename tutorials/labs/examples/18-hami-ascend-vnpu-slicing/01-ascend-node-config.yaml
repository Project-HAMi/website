# The v1.4.0 device-plugin manifest mounts this ConfigMap on every Ascend node.
# An empty nodes list means every node follows the global vnpus.hamiVnpuCore
# switch in the hami-scheduler-device ConfigMap. To enable soft slicing on one
# node regardless of the global switch, add a node-level entry:
#   nodes:
#     - name: "ascend-240"
#       hami-vnpu-core: true
apiVersion: v1
kind: ConfigMap
metadata:
  name: hami-device-node-config
  namespace: kube-system
data:
  node-config.yaml: |-
    nodes: []
