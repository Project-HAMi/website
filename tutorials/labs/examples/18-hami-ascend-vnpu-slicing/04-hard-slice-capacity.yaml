# Eight identical vir01 requests on one 310P3. The verified node advertises
# seven 3072 MiB template slots, so the eighth Pod remains Pending.
apiVersion: v1
kind: Pod
metadata:
  name: hami-310p-oversubscribe-0
  labels:
    app: hami-310p-oversubscribe
    hami.run/lab-18: "true"
spec:
  schedulerName: hami-scheduler
  runtimeClassName: ascend
  containers:
    - name: npu
      image: docker.io/ascendai/cann:7.0.1-310p-openeuler20.03-py3.8
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
      command: ["bash", "-lc", "echo HARD_OK; sleep 86400"]
      resources:
        limits:
          huawei.com/Ascend310P: "1"
          huawei.com/Ascend310P-memory: "1024"
---
