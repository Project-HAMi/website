# Step 7: plain tenant on an empty node; default spread places it on
# the first card, which becomes the "used" card X of the scenario.
apiVersion: v1
kind: Pod
metadata:
  name: policy-tenant
  labels:
    hami.run/lab-14: "true"
spec:
  containers:
    - name: app
      image: ubuntu:22.04
      command: ["bash", "-c", "sleep infinity"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 1000
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      env:
        - name: LD_LIBRARY_PATH
          value: /host-nvidia/lib64
      volumeMounts:
        - name: host-nvidia-libs
          mountPath: /host-nvidia/lib64
          readOnly: true
  volumes:
    - name: host-nvidia-libs
      hostPath:
        path: /home/kubernetes/bin/nvidia/lib64
        type: Directory
