# Step 7: composed chain. mutex filters out every card with a user
# (including the card plain binpack would prefer), then binpack orders
# the surviving idle cards.
apiVersion: v1
kind: Pod
metadata:
  name: policy-combined-a
  labels:
    hami.run/lab-14: "true"
  annotations:
    hami.io/gpu-scheduler-policy: "mutex,binpack"
spec:
  containers:
    - name: app
      image: ubuntu:22.04
      command: ["bash", "-c", "sleep infinity"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 1000
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      env:
        - name: LD_LIBRARY_PATH
          value: /host-nvidia/lib64
      volumeMounts:
        - name: host-nvidia-libs
          mountPath: /host-nvidia/lib64
          readOnly: true
  volumes:
    - name: host-nvidia-libs
      hostPath:
        path: /home/kubernetes/bin/nvidia/lib64
        type: Directory

