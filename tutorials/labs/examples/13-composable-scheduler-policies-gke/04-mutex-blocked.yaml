# Step 6: applied when every card already has a user; stays Pending
# with ExclusiveDeviceAllocateConflict until a card is freed.
apiVersion: v1
kind: Pod
metadata:
  name: policy-mutex-c
  labels:
    hami.run/lab-13: "true"
  annotations:
    hami.io/gpu-scheduler-policy: "mutex"
spec:
  containers:
    - name: app
      image: ubuntu:22.04
      command: ["bash", "-c", "sleep infinity"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 1000
      env:
        - name: LD_LIBRARY_PATH
          value: /host-nvidia/lib64
      volumeMounts:
        - name: host-nvidia-libs
          mountPath: /host-nvidia/lib64
          readOnly: true
  volumes:
    - name: host-nvidia-libs
      hostPath:
        path: /home/kubernetes/bin/nvidia/lib64
        type: Directory
