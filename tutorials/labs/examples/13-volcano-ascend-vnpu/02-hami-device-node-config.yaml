# Per-node HAMi device plugin configuration: enable hami-vnpu-core on one node.
# Replace "aio-node74-arm" with your Ascend node name. vDeviceCount is the max
# vNPU count per physical card (the 310P3 driver caps it at 7 in practice).
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: hami-scheduler
    app.kubernetes.io/name: hami
    app.kubernetes.io/instance: hami
  name: hami-device-node-config
  namespace: kube-system
data:
  node-config.yaml: |-
    nodes:
      - name: "aio-node74-arm"
        hami-vnpu-core: true
        vDeviceCount: 8
        filterDevices:
          index: []
          uuid: []
