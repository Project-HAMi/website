<circle class="pulse" cx="472.8888888888889" cy="271" r="6" fill="#10B05A"/>
<text x="484.8888888888889" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">Running</text>
</svg>
