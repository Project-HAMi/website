name: Content Rules

# Enforces the Writing Style rules in docs/contributor/contribute-docs.md and
# the visual rules in BRAND.md on the lines each pull request adds.
# `edited` re-runs the check when the PR description (the declarations) changes.
on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: content-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content-rules:
    name: Content Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The merge commit and its first parent (the current master).
          fetch-depth: 2
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Check content rules
        run: node scripts/check-content-rules.mjs --base HEAD^1
